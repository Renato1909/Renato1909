<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Renato Silva — Valores, missão e código</title>
  <desc id="desc">Banner vetorial de estética manifesto: faixas verde, azul e dourado, uma cruz minimalista e uma janela de código.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A31"/><stop offset=".54" stop-color="#0B2746"/><stop offset="1" stop-color="#06182A"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#008C5A"/><stop offset="1" stop-color="#00B878"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E1B447"/><stop offset="1" stop-color="#FFE08A"/>
    </linearGradient>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".7" fill="#FFF" fill-opacity=".13"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020B15" flood-opacity=".6"/></filter>
  </defs>

  <rect width="1600" height="520" rx="20" fill="url(#base)"/>
  <rect width="1600" height="520" rx="20" fill="url(#paper)" opacity=".18"/>

  <!-- Faixas geométricas: linguagem visual de manifesto, sem marcas partidárias -->
  <path d="M0 0H622L416 520H0V0Z" fill="url(#green)" opacity=".94"/>
  <path d="M0 0H58L0 148V0Z" fill="#F2CB5D"/>
  <path d="M510 0H640L439 520H309L510 0Z" fill="#F2CB5D" opacity=".96"/>
  <path d="M0 452L520 276L476 382L0 520V452Z" fill="#071A31" fill-opacity=".4"/>
  <path d="M680 0L829 0L617 520L469 520L680 0Z" fill="#00B878" fill-opacity=".23"/>

  <!-- Cruz minimalista, intencionalmente discreta -->
  <g transform="translate(94 77)" fill="#FFF4D0">
    <rect x="30" width="13" height="80" rx="2"/>
    <rect y="24" width="73" height="13" rx="2"/>
  </g>
  <text x="94" y="205" fill="#FFF4D0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">FÉ · PROPÓSITO · TRABALHO</text>
  <path d="M94 224H355" stroke="#FFF4D0" stroke-opacity=".65" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="92" y="300" fill="#FFFFFF" font-size="62" font-weight="800" letter-spacing="-2">Renato Silva</text>
    <text x="95" y="345" fill="#EAF6F0" font-size="23" font-weight="600" letter-spacing=".3">DESENVOLVIMENTO DE SISTEMAS</text>
    <text x="95" y="385" fill="#EAF6F0" font-size="17">ideias firmes. soluções que funcionam.</text>
  </g>
  <rect x="94" y="420" width="342" height="37" rx="3" fill="#071A31" fill-opacity=".88"/>
  <text x="110" y="445" fill="#FFE08A" font-family="monospace" font-size="16" font-weight="700">const missão = "construir";</text>

  <!-- Janela de código limpa e tipográfica -->
  <g filter="url(#shadow)">
    <rect x="772" y="72" width="703" height="374" rx="8" fill="#07111D" stroke="#4A6680" stroke-width="1.2"/>
    <rect x="772" y="72" width="703" height="53" rx="8" fill="#10263A"/>
    <path d="M772 117H1475" stroke="#4A6680"/>
    <circle cx="806" cy="98" r="7" fill="#E66155"/><circle cx="830" cy="98" r="7" fill="#E1B447"/><circle cx="854" cy="98" r="7" fill="#34A873"/>
    <text x="891" y="103" fill="#B7C9D9" font-family="monospace" font-size="15">renato / propósito.ts</text>
    <g font-family="monospace" font-size="19">
      <text x="811" y="172" fill="#668197">01</text><text x="855" y="172" fill="#F3CD72">interface</text><text x="958" y="172" fill="#77C7FF"> Caminho</text><text x="1048" y="172" fill="#D9E4EE"> {</text>
      <text x="811" y="215" fill="#668197">02</text><text x="855" y="215" fill="#7EE0AB">  valores</text><text x="948" y="215" fill="#D9E4EE">: [</text><text x="972" y="215" fill="#FFE08A">"fé"</text><text x="1025" y="215" fill="#D9E4EE">, </text><text x="1048" y="215" fill="#FFE08A">"serviço"</text><text x="1143" y="215" fill="#D9E4EE">];</text>
      <text x="811" y="258" fill="#668197">03</text><text x="855" y="258" fill="#7EE0AB">  método</text><text x="948" y="258" fill="#D9E4EE">: </text><text x="973" y="258" fill="#FFE08A">"aprender fazendo"</text><text x="1182" y="258" fill="#D9E4EE">;</text>
      <text x="811" y="301" fill="#668197">04</text><text x="855" y="301" fill="#7EE0AB">  objetivo</text><text x="970" y="301" fill="#D9E4EE">: </text><text x="995" y="301" fill="#FFE08A">"impacto real"</text><text x="1152" y="301" fill="#D9E4EE">;</text>
      <text x="811" y="344" fill="#668197">05</text><text x="855" y="344" fill="#D9E4EE">}</text>
    </g>
    <path d="M855 377H1237" stroke="#29465E"/>
    <text x="855" y="408" fill="#00C782" font-family="monospace" font-size="15">✓ build concluído — pronto para o próximo desafio</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="776" y="483" fill="#AFC6D7" font-size="15" letter-spacing="2">SÃO PAULO, BRASIL</text>
    <text x="1280" y="483" fill="#FFE08A" font-size="15" font-weight="700" letter-spacing="2">CÓDIGO COM PROPÓSITO</text>
  </g>
  <path d="M772 464H1475" stroke="url(#gold)" stroke-width="2"/>
</svg>
