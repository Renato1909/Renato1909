name: Guarda de segredos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: Gitleaks sobre todo o historico
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Baixar gitleaks com verificacao de checksum
        run: |
          set -euo pipefail
          gh release download "v${GITLEAKS_VERSION}" \
            -R gitleaks/gitleaks \
            -p "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -p "gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            -D /tmp/gl
          cd /tmp/gl
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "/tmp/gl" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Executar varredura do historico completo
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact=25 \
            --exit-code 1 \
            --report-format json \
            --report-path /tmp/leaks.json \
            --no-banner

      - name: Resumo no log do job
        if: always()
        run: |
          if [ -s /tmp/leaks.json ]; then
            echo "## Achados do gitleaks" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "- `\(.RuleID)` em `\(.Path):\(.Line)` (commit \(.Commit[:7]))"' /tmp/leaks.json \
              | head -50 >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "Nenhum segredo detectado." >> "$GITHUB_STEP_SUMMARY"
          fi

  varredura-profunda:
    name: Entropia e padroes proprios sobre todo o historico
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Executar scanner do repositorio
        run: node tools/secret-scan.mjs .

  protecao-de-diff:
    name: Bloqueio antecipado no diff do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Varredura apenas dos arquivos acompanhados
        run: node tools/secret-scan.mjs . --worktree-only
