name: Update Languages SVG

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/languages_svg.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Renato1909
        run: python scripts/languages_svg.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/languages.svg
          if git diff --cached --quiet; then
            echo "Sem mudancas no SVG"
          else
            git commit -m "chore: atualiza languages.svg"
            git push
          fi
